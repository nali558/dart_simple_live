name: Build Windows

on:
  workflow_dispatch:  # 手动触发

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      # 签出代码
      - uses: actions/checkout@v4
        with:
          ref: master
      
      # 设置Flutter环境
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.x"
          cache: true
      
      - name: Enable Flutter Desktop
        run: flutter config --enable-windows-desktop
      
      - name: Restore Packages
        run: |
          cd simple_live_app
          flutter pub get
      
      # 安装flutter_distributor
      - name: Install flutter_distributor
        run: dart pub global activate flutter_distributor
      
      # build Windows ZIP\MSIX
      - name: Build Windows
        run: |
          cd simple_live_app
          flutter_distributor package --platform windows --targets msix,zip --skip-clean
      
      # 上传Windows至Artifacts
      - name: Upload Windows APP to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            simple_live_app/build/dist/*/*.msix
            simple_live_app/build/dist/*/*.zip
          if-no-files-found: warn
      
      - run: echo "Windows job's status is ${{ job.status }}."
